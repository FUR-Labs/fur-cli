[package]
name = "fur-cli"
version = "1.7.0"
edition = "2021"
authors = ["Andrew Garcia"]
description = "Turn your AI chats into a durable, local-first diary. Save messages, attach notes, organize conversations, and stop losing context every time the model forgets you exist."
license = "MIT"
readme = "README.md"
repository = "https://github.com/andrewrgarcia/fur-cli"
homepage = "https://furchats.vercel.app"
keywords = ["cli", "notes", "ai", "chat", "versioning"]
categories = ["command-line-utilities"]

[[bin]]
name = "fur"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rand = "0.9.2"
colored = "3.0.0"
emojis = "0.6"
walkdir = "2.5.0"
dirs = "6.0.0"
regex = "1"
sha2 = "0.10.9"
indicatif = "0.17"
aesus = "0.3"
rpassword = "7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lib]
name = "fur_cli"
path = "src/lib.rs"

